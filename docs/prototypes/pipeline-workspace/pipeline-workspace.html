(function (root) {

    for (const [key, min, max] of [['concurrency', 1, 50], ['timeout', 1, 1440], ['retries', 0, 10]]) {
      const label = { concurrency: 'execuções simultâneas', timeout: 'tempo limite em minutos', retries: 'tentativas adicionais' }[key];

    }
    const ids = new Set(nodes.map(n => n.id));
    for (const node of nodes) {
      if (!node.name.trim()) issues.push({ node: node.id, message: 'Uma etapa precisa de nome.' });
      if (!node.job.trim()) issues.push({ node: node.id, message: `Selecione o recurso de ${node.name}.` });
      for (const [key, min, max] of [['timeout', 1, 1440], ['retries', 0, 10]]) if (node[key] != null && (!/^\d+$/.test(node[key]) || Number(node[key]) < min || Number(node[key]) > max)) issues.push({ node: node.id, message: `Revise o tratamento de falha de ${node.name}.` });
      for (const dep of node.deps) if (!ids.has(dep)) issues.push({ node: node.id, message: 'Dependência inexistente.' });
    }
    const visiting = new Set(), visited = new Set();
    function walk(id) {
      if (visiting.has(id)) return true;
      if (visited.has(id)) return false;
      visiting.add(id);
      const node = nodes.find(n => n.id === id);
      if (node && node.deps.some(walk)) return true;
      visiting.delete(id); visited.add(id); return false;
    }
    if (nodes.some(n => walk(n.id))) issues.push({ message: 'Há um ciclo nas dependências. Remova a ligação circular.' });
    return issues;
  }

    return {
      id: `SIM-${String(serial).padStart(4, '0')}`, version: version.number,
      snapshot: clone(version.snapshot), scenario, started: now, finished: null, status: 'running',

        task.logs.push({ time: now, message: failed ? 'Falha simulada: regra de qualidade não atendida.' : 'Etapa concluída na simulação.' });
        task.history.push({ attempt: task.attempt, state: task.state, started: task.started, finished: now });
      }
    }
    for (const node of nodes) {
      const task = run.tasks[node.id];
      if (!['pending', 'dependencies', 'capacity'].includes(task.state)) continue;
      const deps = node.deps.map(id => run.tasks[id]?.state);
      if (deps.some(s => ['failed', 'blocked'].includes(s))) { task.state = 'blocked'; continue; }
      if (!deps.every(s => ['success', 'skipped'].includes(s))) { task.state = 'dependencies'; continue; }
      if (run.scenario === 'capacity' && now - run.started < 4000) { task.state = 'capacity'; continue; }
      if (run.scenario === 'skip' && node.kind === 'delivery') {
        task.state = 'skipped'; task.finished = now;
        task.logs.push({ time: now, message: 'Entrega pulada pela condição simulada.' }); continue;
      }

    }

  function createPipeline(event) {

    p.saved = snapshot(p); pipelines.push(p); current = key; history = []; future = []; selected = null; issues = null; activeRun = null; connected = true; page = 'workspace'; tab = 'assembly'; mode = 'build'; libraryOpen = true; inspectorOpen = true; zoom = null;

  function addNode(kind, position) {
    if (!writable()) return;

    const node = { id: `etapa-${Date.now()}`, name: spec.name, kind, job: spec.job, connection: spec.connection, duration: spec.duration, pythonMode: 'Arquivo existente', decisionMode: 'Sim / Não', waitPolicy: 'Todas com sucesso', onError: 'Falhar a etapa', inheritRecipients: 'Sim', deps: [], x: position?.x ?? 30 + (n % 4) * 190, y: position?.y ?? 35 + Math.floor(n / 4) * 140, retries: '2', timeout: '20', parameter: '' };
    mutate(p => p.nodes.push(node)); selected = node.id; inspectorOpen = true; if (innerWidth <= 1020) libraryOpen = false; render(); notify('Etapa adicionada. Escolha as dependências nos detalhes.');

  function save() {
    if (!writable() || !pipeline().dirty) return;

  function publishDialog() {

  function confirmPublish() {

  function startRun() {

    activeRun = M.newRun(version, scenario, Date.now(), ++serial); M.advance(activeRun, Date.now()); p.runs.push(activeRun); frozenRun = null; connected = true; lastSignal = Date.now(); tab = 'execution'; mode = 'run'; page = 'workspace'; selected = version.snapshot.nodes[0]?.id; inspectorTab = 'summary'; inspectorOpen = true; zoom = null; render(); notify(`Simulação ${activeRun.id} iniciada com a versão ${version.number}.`);

  function compare(number) {
    const p = pipeline(), version = p.versions.find(v => v.number === number), rows = [];
    for (const [key, value] of Object.entries(p.config)) if (JSON.stringify(value) !== JSON.stringify(version.snapshot.config[key])) rows.push(`<div class="diff-row"><strong>${esc(key)}</strong><br>${esc(version.snapshot.config[key])} → ${esc(value)}</div>`);
    const before = version.snapshot.nodes;
    for (const node of p.nodes) {
      const old = before.find(n => n.id === node.id);
      if (!old) rows.push(`<div class="diff-row"><strong>Etapa adicionada:</strong> ${esc(node.name)}</div>`);
      else if (JSON.stringify(node) !== JSON.stringify(old)) rows.push(`<div class="diff-row"><strong>Etapa alterada:</strong> ${esc(node.name)}</div>`);
    }
    for (const old of before) if (!p.nodes.some(n => n.id === old.id)) rows.push(`<div class="diff-row"><strong>Etapa removida:</strong> ${esc(old.name)}</div>`);
    showDialog(`Rascunho × versão ${esc(number)}`, `<p>Compare o rascunho atual com a versão publicada.</p><div class="version-diff">${rows.join('') || '<p class="validation-good">Nenhuma diferença. O rascunho corresponde a esta versão.</p>'}</div>`, button('close-dialog','Fechar','primary'));

  function handleAction(action) {

    else if (action === 'undo' && history.length && writable()) { future.push(snapshot(pipeline())); Object.assign(pipeline(), history.pop()); pipeline().dirty = JSON.stringify(snapshot(pipeline())) !== JSON.stringify(pipeline().saved); issues = null; render(); }
    else if (action === 'redo' && future.length && writable()) { history.push(snapshot(pipeline())); Object.assign(pipeline(), future.pop()); pipeline().dirty = JSON.stringify(snapshot(pipeline())) !== JSON.stringify(pipeline().saved); issues = null; render(); }
    else if (action === 'delete-node' && selected && writable()) {
      const node = pipeline().nodes.find(n => n.id === selected); if (!node) return;
      showDialog('Remover etapa', `<p>Remover “${esc(node.name)}” também remove suas ligações. Você poderá desfazer a alteração antes de publicar.</p>`, `${button('close-dialog','Cancelar')}${button('confirm-delete','Remover etapa','danger')}`);

  document.addEventListener('click', event => {

    if (element.dataset.tab) { tab = element.dataset.tab; if (tab === 'assembly') mode = 'build'; if (tab === 'execution') { mode = 'run'; activeRun ||= pipeline().runs.at(-1) || null; } selected = activeNodes().some(n => n.id === selected) ? selected : activeNodes()[0]?.id; render(); }
    
    else if (element.dataset.kind) addNode(element.dataset.kind);
    else if (element.dataset.node) { if (dragging?.moved) return; selected = element.dataset.node; inspectorOpen = true; if (innerWidth <= 1020) libraryOpen = false; render(); }
    else if (element.dataset.configSection) { configSection = element.dataset.configSection; render(); }
    else if (element.dataset.inspectorTab) { inspectorTab = element.dataset.inspectorTab; render(); }
    else if (element.dataset.openPipeline) { current = element.dataset.openPipeline; page = 'workspace'; tab = writable() ? 'assembly' : 'execution'; mode = writable() ? 'build' : 'run'; history = []; future = []; issues = null; selected = pipeline().nodes[0]?.id; activeRun = pipeline().runs.at(-1) || null; connected = true; frozenRun = null; zoom = null; render(); }
    else if (element.dataset.openRun) { activeRun = pipeline().runs.find(r => r.id === element.dataset.openRun); connected = true; frozenRun = null; tab = 'execution'; mode = 'run'; selected = activeRun.snapshot.nodes[0]?.id; inspectorTab = 'summary'; $('#dialog').close(); render(); }
    else if (element.dataset.compare) compare(element.dataset.compare);
    else if (element.dataset.restore && writable()) {
      const version = pipeline().versions.find(v => v.number === element.dataset.restore); mutate(p => Object.assign(p, M.clone(version.snapshot))); tab = 'assembly'; mode = 'build'; selected = pipeline().nodes[0]?.id; render(); notify(`Versão ${version.number} copiada para o rascunho. Nenhuma versão publicada foi alterada.`);
    }
    else if (element.dataset.issue) { const issue = issues[Number(element.dataset.issue)]; if (issue.node) { selected = issue.node; inspectorOpen = true; render(); } else if (issue.field) { tab = 'config'; configSection = ['concurrency','timeout','retries'].includes(issue.field) ? 'execution' : 'identity'; render(); } }
  });
  document.addEventListener('submit', event => { if (event.target.id === 'create-form') createPipeline(event); });
  document.addEventListener('input', event => {
    if (event.target.dataset.configField && writable() && event.target.tagName !== 'SELECT') {
      const name = event.target.dataset.configField;
      if (pipeline().config[name] !== event.target.value) { mutate(p => p.config[name] = event.target.value); refreshEditedUI(); }
    }
    if (event.target.dataset.nodeField && writable() && event.target.tagName !== 'SELECT') {
      const name = event.target.dataset.nodeField, node = pipeline().nodes.find(n => n.id === selected);
      if (node && node[name] !== event.target.value) { mutate(p => p.nodes.find(n => n.id === selected)[name] = event.target.value); refreshEditedUI(); }
    }
    if (event.target.id === 'create-name' && !$('#create-id').dataset.manual) $('#create-id').value = event.target.value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,60);
    if (event.target.id === 'create-id') event.target.dataset.manual = 'true';
    if (event.target.id === 'pipeline-search') { filter = event.target.value; $('#pipeline-rows').innerHTML = listRows(); $('#list-empty').hidden = !!listRows(); }
    if (event.target.id === 'library-search') document.querySelectorAll('.library-item').forEach(item => item.hidden = !item.textContent.toLowerCase().includes(event.target.value.toLowerCase()));
  });
  document.addEventListener('change', event => {
    const target = event.target;
    if (target.id === 'role') { role = target.value; if (tab === 'assembly' || tab === 'execution') { if (!writable()) tab = 'execution'; mode = tab === 'assembly' ? 'build' : 'run'; } connected = true; frozenRun = null; render(); notify(`Experiência de ${target.options[target.selectedIndex].text} ativada. Permissões simuladas.`); }
    else if (target.id === 'scenario') scenario = target.value;
    else if (target.dataset.configField && writable() && target.tagName === 'SELECT') { const name = target.dataset.configField; mutate(p => p.config[name] = target.value); if (['schedule','active'].includes(name)) render(); else refreshEditedUI(); }
    else if (target.dataset.nodeField && writable() && target.tagName === 'SELECT') { const name = target.dataset.nodeField; mutate(p => p.nodes.find(n => n.id === selected)[name] = target.value); refreshEditedUI(); }
    else if (target.dataset.dependency && writable()) {
      const id = target.dataset.dependency, checked = target.checked;
      const draft = snapshot(pipeline()), node = draft.nodes.find(n => n.id === selected); node.deps = checked ? [...node.deps, id] : node.deps.filter(dep => dep !== id);
      if (M.validate(draft).some(i => /ciclo/.test(i.message))) { target.checked = !checked; notify('Essa dependência criaria um ciclo. Escolha outra etapa.'); return; }
      mutate(p => p.nodes.find(n => n.id === selected).deps = node.deps); refreshEditedUI();
    }
  });
  document.addEventListener('keydown', event => {
    const editing = /INPUT|TEXTAREA|SELECT/.test(event.target.tagName);
    if (event.key === 'Escape' && $('#dialog').open) $('#dialog').close();
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 's') { event.preventDefault(); if (!$('#dialog').open) save(); }
    if (!editing && !$('#dialog').open && (event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'z') { event.preventDefault(); handleAction(event.shiftKey ? 'redo' : 'undo'); }
    if (!editing && !$('#dialog').open && event.key === 'Delete' && mode === 'build' && (tab === 'assembly' || tab === 'execution')) handleAction('delete-node');
  });
  document.addEventListener('dragstart', event => {
    const item = event.target.closest('[data-kind]'); if (item && writable()) event.dataTransfer.setData('text/plain', item.dataset.kind);
  });
  document.addEventListener('dragover', event => { if (event.target.closest('#canvas-scroll') && writable() && mode === 'build') event.preventDefault(); });
  document.addEventListener('drop', event => {
    const canvas = event.target.closest('#canvas-scroll'); if (!canvas || !writable() || mode !== 'build') return;
    event.preventDefault(); const kind = event.dataTransfer.getData('text/plain'); if (!kinds[kind]) return;
    const rect = canvas.getBoundingClientRect(), scale = Number($('#graph')?.style.getPropertyValue('--zoom')) || 1;
    addNode(kind, { x: Math.max(10, (event.clientX - rect.left + canvas.scrollLeft) / scale - 77), y: Math.max(10, (event.clientY - rect.top + canvas.scrollTop) / scale - 43) });
  });
  document.addEventListener('pointerdown', event => {
    const element = event.target.closest('[data-node]'); if (!element || mode !== 'build' || !writable() || event.button !== 0) return;
    const node = pipeline().nodes.find(n => n.id === element.dataset.node);
    dragging = { element, id: node.id, x: node.x, y: node.y, startX: event.clientX, startY: event.clientY, moved: false, nextX: node.x, nextY: node.y };
    element.setPointerCapture(event.pointerId);
  });
  document.addEventListener('pointermove', event => {
    if (!dragging) return;
    const scale = Number($('#graph')?.style.getPropertyValue('--zoom')) || 1;
    if (Math.abs(event.clientX - dragging.startX) + Math.abs(event.clientY - dragging.startY) > 5) dragging.moved = true;
    if (!dragging.moved) return;
    dragging.nextX = Math.max(10, Math.min(1400, dragging.x + (event.clientX - dragging.startX) / scale));
    dragging.nextY = Math.max(10, Math.min(800, dragging.y + (event.clientY - dragging.startY) / scale));
    dragging.element.style.left = `${dragging.nextX}px`; dragging.element.style.top = `${dragging.nextY}px`;
  });
  document.addEventListener('pointerup', () => {
    if (!dragging) return;
    const drag = dragging;
    if (drag.moved) { mutate(p => { const node = p.nodes.find(n => n.id === drag.id); node.x = Math.round(drag.nextX); node.y = Math.round(drag.nextY); }); selected = drag.id; render(); }
    setTimeout(() => dragging = null, 0);
  });
  document.addEventListener('pointercancel', () => { dragging = null; render(); });
  setInterval(() => {
    const runningRuns = pipelines.flatMap(p => p.runs).filter(run => run.status === 'running');
    if (!runningRuns.length) return;
    const time = Date.now(), before = activeRun ? JSON.stringify(Object.values(activeRun.tasks).map(t => [t.state,t.attempt])) : '';
    for (const run of runningRuns) M.advance(run, time);
    if (!connected) return;
    lastSignal = time;
    if (page === 'workspace' && (tab === 'assembly' || tab === 'execution') && mode === 'run' && activeRun) {
      const after = JSON.stringify(Object.values(activeRun.tasks).map(t => [t.state,t.attempt]));
      if (before !== after) render();
      else {
        if ($('#run-duration')) $('#run-duration').textContent = duration((activeRun.finished ?? time) - activeRun.started);
        const task = activeRun.tasks[selected]; if (task && $('#task-duration')) $('#task-duration').textContent = duration(task.started == null ? null : (task.finished ?? time) - task.started);
      }
    }
  }, 250);
  render();
})();
</script></body>
