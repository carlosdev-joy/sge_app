<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#081d43">
  <title>ORQUESTRA · Pipeline — protótipo navegável</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="model.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#content">Ir para o espaço de trabalho</a>
  <header class="topbar">
    <a class="brand" href="#" data-action="home" aria-label="ORQUESTRA, pipelines"><span class="brand-symbol" aria-hidden="true">◈</span> ORQUESTRA</a>
    <span class="product-name">Workspace</span>
    <span class="prototype-tag">Protótipo · dados simulados</span>
    <div class="topbar-end"><label class="sr-only" for="role">Experiência simulada</label><select id="role"><option value="dev">Desenvolvimento</option><option value="read">Consulta</option><option value="ops">Sustentação</option></select><span class="avatar" title="Usuário de demonstração">AL</span></div>
  </header>
  <div class="shell">
    <nav class="rail" aria-label="Navegação principal">
      <span class="rail-group">Construção</span>
      <button class="rail-link active" data-action="home"><span aria-hidden="true">◇</span> Pipelines</button>
      <button class="rail-link" data-action="future"><span aria-hidden="true">▦</span> Malhas <span class="soon">Depois</span></button>
      <span class="rail-group">Operação</span>
      <button class="rail-link" data-action="all-runs"><span aria-hidden="true">◷</span> Execuções</button>
      <div class="rail-bottom"><span class="env-dot"></span> Ambiente de exemplo<br><small>UX em validação</small><button class="text-button" data-action="guide">Como testar</button></div>
    </nav>
    <main id="content" tabindex="-1"></main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
</body>
</html>
