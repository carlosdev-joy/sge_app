<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 44" fill="none">
  <style>
    @media (prefers-color-scheme: dark) {
      .c3 { stroke: #93C5FD; } .d3 { fill: #93C5FD; }
    }
  </style>
  <!-- Linha 3 — fundo (azul escuro) -->
  <line x1="24" y1="38" x2="44" y2="5" stroke="#0B1A30" stroke-width="3.2" stroke-linecap="round" class="c3"/>
  <circle cx="24" cy="38" r="3.8" fill="#0B1A30" class="d3"/>
  <circle cx="44" cy="5"  r="3.8" fill="#0B1A30" class="d3"/>
  <!-- Linha 2 — meio (azul médio) -->
  <line x1="14" y1="38" x2="34" y2="5" stroke="#1E40AF" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="14" cy="38" r="3.8" fill="#1E40AF"/>
  <circle cx="34" cy="5"  r="3.8" fill="#1E40AF"/>
  <!-- Linha 1 — frente (ciano) -->
  <line x1="4"  y1="38" x2="24" y2="5" stroke="#06B6D4" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="4"  cy="38" r="3.8" fill="#06B6D4"/>
  <circle cx="24" cy="5"  r="3.8" fill="#06B6D4"/>
</svg>
