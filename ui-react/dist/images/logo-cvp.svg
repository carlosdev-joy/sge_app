<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 90" fill="none">
  <!-- Símbolo Caixa: dois losangos laranja em diagonal -->
  <!-- Losango superior -->
  <polygon points="110,4 136,22 110,40 84,22" fill="#f39200"/>
  <!-- Losango inferior (deslocado, parcial) -->
  <polygon points="96,28 122,46 96,64 70,46" fill="#f39200"/>

  <!-- Texto CAIXA em branco (estilizado, letras maiúsculas) -->
  <text x="110" y="58" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="18" font-weight="700" fill="white" letter-spacing="4">CAIXA</text>

  <!-- Vida e Previdência em branco, estilo itálico fino -->
  <text x="110" y="78" text-anchor="middle" font-family="Georgia, serif"
        font-size="11" font-style="italic" fill="white" opacity="0.85"
        letter-spacing="1">Vida e Previdência</text>
</svg>
