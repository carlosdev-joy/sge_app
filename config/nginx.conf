worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Tamanho máximo de upload (DSX podem ser grandes)
    client_max_body_size 64M;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Proxy da API Airflow — webserver interno
        location /api/v1/ {
            proxy_pass         http://airflow-webserver:8080/api/v1/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Authorization     $http_authorization;
            proxy_pass_header  Authorization;
            proxy_read_timeout 120s;
        }

        # Proxy ORQUESTRA API
        location /orquestra/ {
            proxy_pass         http://orquestra-api:8000/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_connect_timeout 60s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
        }

        # Branding persistente (logo da empresa).
        location /branding/ {
            alias /usr/share/nginx/branding/;
            add_header Cache-Control "public, max-age=3600";
            access_log off;
        }

        # ORQUESTRA Shell — terminal web + chat IA (processo host, porta 8765)
        # O IP 172.17.0.1 é o gateway padrão do Docker que aponta para o host.
        # Confirme com: ip addr show docker0 | grep 'inet '
        location /shell/ {
            proxy_pass         http://172.17.0.1:8765/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_connect_timeout 10s;
            proxy_read_timeout    120s;
        }

        # Redirect raiz para o app React
        location = / {
            return 302 /v2/;
        }

        # React SPA — qualquer rota desconhecida cai no index.html
        location / {
            add_header Cache-Control "no-cache, must-revalidate";
            try_files $uri $uri/ /index.html;
        }
    }
}
