worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Tamanho máximo de upload (DSX podem ser grandes)
    client_max_body_size 64M;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Proxy da API Airflow → webserver interno
        location /api/v1/ {
            proxy_pass         http://airflow-webserver:8080/api/v1/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Authorization     $http_authorization;
            proxy_pass_header  Authorization;
            proxy_read_timeout 120s;
        }

        # Proxy ORQUESTRA API
        location /orquestra/ {
            proxy_pass         http://orquestra-api:8000/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        # UI estática — qualquer rota cai no index.html (SPA)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
