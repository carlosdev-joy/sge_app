worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Tamanho máximo de upload (DSX podem ser grandes)
    client_max_body_size 64M;

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS ─────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Certificado (gerado via openssl — ver scripts/gerar-cert.sh)
        ssl_certificate     /etc/nginx/certs/orquestra.crt;
        ssl_certificate_key /etc/nginx/certs/orquestra.key;

        # Protocolos e cifras seguras
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5:!RC4;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Proxy da API Airflow → webserver interno
        location /api/v1/ {
            proxy_pass         http://airflow-webserver:8080/api/v1/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Authorization     $http_authorization;
            proxy_pass_header  Authorization;
            proxy_read_timeout 120s;
        }

        # Proxy ORQUESTRA API
        location /orquestra/ {
            proxy_pass         http://orquestra-api:8000/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # UI estática — qualquer rota cai no index.html (SPA)
        location / {
            add_header Cache-Control "no-cache, must-revalidate";
            try_files $uri $uri/ /index.html;
        }
    }
}
